<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Secure mobile app protected by the Wisent Code bison shield</title>
  <desc id="d">A smartphone showing a bison emblem inside a shield, connected to a code editor card and a security audit checklist.</desc>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .float-a { animation: float 7s ease-in-out infinite; }
    .float-b { animation: float 8s ease-in-out -2.5s infinite; }
    .float-c { animation: float 6s ease-in-out -1s infinite; }
    .float-d { animation: float 9s ease-in-out -4s infinite; }
    .flow    { stroke-dasharray: 3 7; animation: flow 1.6s linear infinite; }
    .ring    { animation: ring 5s ease-in-out infinite; }
    .halo    { animation: halo 4s ease-in-out infinite; }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes flow    { to { stroke-dashoffset: -20; } }
    @keyframes ring    { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes halo    { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3056d3"/>
      <stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="450" cy="440" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#3056d3" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#3056d3" stop-opacity=".22"/>
      <stop offset="1"   stop-color="#3056d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="450" cy="168" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a6bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringStroke" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="440">
      <stop offset="0" stop-color="#9db8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset=".5" stop-color="#121829"/>
      <stop offset="1" stop-color="#0a0e19"/>
    </linearGradient>
    <linearGradient id="phoneEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c33"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3056d3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a2f78" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="connector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b86ff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#5b86ff" stop-opacity=".15"/>
    </linearGradient>

    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur6"  x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".6"/>
    </filter>

    <clipPath id="screenClip"><rect x="338" y="44" width="224" height="420" rx="30"/></clipPath>
  </defs>

  <!-- ===== Ambient background (transparent, blends into any dark hero) ===== -->
  <ellipse cx="450" cy="440" rx="440" ry="250" fill="url(#floorGlow)"/>

  <g stroke="url(#ringStroke)" stroke-width="1.2">
    <circle class="ring" cx="450" cy="430" r="170"/>
    <circle class="ring" cx="450" cy="430" r="250" style="animation-delay:-1.2s"/>
    <circle class="ring" cx="450" cy="430" r="330" style="animation-delay:-2.4s"/>
    <circle class="ring" cx="450" cy="430" r="410" style="animation-delay:-3.6s"/>
  </g>

  <g fill="#cfe0ff">
    <circle class="twinkle" cx="62"  cy="58"  r="1.6"/>
    <circle class="twinkle" cx="150" cy="30"  r="1.2" style="animation-delay:-1s"/>
    <circle class="twinkle" cx="236" cy="62"  r="1.4" style="animation-delay:-2s"/>
    <circle class="twinkle" cx="300" cy="22"  r="1.1" style="animation-delay:-3s"/>
    <circle class="twinkle" cx="388" cy="20"  r="1.5" style="animation-delay:-.5s"/>
    <circle class="twinkle" cx="520" cy="26"  r="1.2" style="animation-delay:-2.6s"/>
    <circle class="twinkle" cx="600" cy="64"  r="1.6" style="animation-delay:-1.6s"/>
    <circle class="twinkle" cx="690" cy="30"  r="1.2" style="animation-delay:-3.4s"/>
    <circle class="twinkle" cx="780" cy="70"  r="1.5" style="animation-delay:-.8s"/>
    <circle class="twinkle" cx="852" cy="34"  r="1.1" style="animation-delay:-2.2s"/>
    <circle class="twinkle" cx="40"  cy="190" r="1.2" style="animation-delay:-1.4s"/>
    <circle class="twinkle" cx="866" cy="200" r="1.4" style="animation-delay:-3.8s"/>
  </g>

  <!-- ===== Phone ===== -->
  <g filter="url(#shadow)">
    <rect x="330" y="36" width="240" height="440" rx="38" fill="url(#phoneBody)"/>
  </g>
  <rect x="330.6" y="36.6" width="238.8" height="440" rx="37.4" stroke="url(#phoneEdge)" stroke-width="1.2"/>
  <!-- side buttons -->
  <rect x="327" y="108" width="3" height="26" rx="1.5" fill="#2b3550"/>
  <rect x="327" y="148" width="3" height="46" rx="1.5" fill="#2b3550"/>
  <rect x="570" y="136" width="3" height="62" rx="1.5" fill="#2b3550"/>

  <!-- screen -->
  <rect x="338" y="44" width="224" height="420" rx="30" fill="url(#screenBg)"/>
  <g clip-path="url(#screenClip)">
    <rect x="338" y="44" width="224" height="420" fill="url(#screenGlow)"/>
    <path class="halo" d="M338 44 H562 V120 C520 90 470 80 338 130 Z" fill="#3a6bff" opacity=".07"/>

    <!-- status bar -->
    <text class="sans" x="362" y="70" font-size="11" font-weight="700" fill="#e6ecf8">9:41</text>
    <g stroke="#e6ecf8" stroke-width="1.1" fill="none" opacity=".85">
      <rect x="524" y="61" width="18" height="9" rx="2.5"/>
    </g>
    <rect x="526" y="63" width="12" height="5" rx="1.2" fill="#e6ecf8" opacity=".85"/>
    <g fill="#e6ecf8" opacity=".85">
      <rect x="500" y="66" width="2.6" height="4" rx=".8"/>
      <rect x="504.5" y="64" width="2.6" height="6" rx=".8"/>
      <rect x="509" y="61.5" width="2.6" height="8.5" rx=".8"/>
    </g>

    <!-- shield with bison -->
    <g class="halo">
      <path d="M450 98 L504 118 V168 C504 204 482 228 450 242 C418 228 396 204 396 168 V118 Z" fill="#3a6bff" opacity=".6" filter="url(#blur14)"/>
    </g>
    <path d="M450 98 L504 118 V168 C504 204 482 228 450 242 C418 228 396 204 396 168 V118 Z"
          fill="url(#shieldFill)" stroke="url(#accentV)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M450 108 L496 125 V167 C496 198 477 218 450 231 C423 218 404 198 404 167 V125 Z"
          stroke="#9db8ff" stroke-opacity=".28" stroke-width="1"/>
    <!-- bison (traced from the Wisent Code logo) -->
    <g transform="translate(418.6 121) scale(0.11728)">
      <g transform="translate(0.000000,648.000000) scale(0.100000,-0.100000)" fill="#ffffff" stroke="none">
        <path d="M2565 6392 c-119 -48 -249 -143 -344 -252 -64 -74 -86 -87 -107 -65 -18 18 -37 10 -74 -30 -14 -15 -64 -60 -111 -101 -48 -40 -112 -107 -142 -147 -70 -93 -83 -104 -90 -77 -18 69 -187 -80 -286 -253 -72 -125 -74 -127 -92 -122 -26 9 -154 -145 -179 -214 -40 -108 -50 -121 -89 -115 -82 13 -306 157 -455 292 -128 115 -268 353 -346 588 -20 58 -24 65 -35 51 -34 -47 -70 -399 -70 -682 0 -309 28 -400 174 -560 45 -48 81 -92 81 -97 0 -15 212 -166 302 -215 57 -30 83 -49 71 -51 -10 -2 -31 -9 -48 -17 -16 -7 -52 -16 -80 -20 -66 -9 -103 -20 -205 -60 -117 -47 -319 -121 -352 -129 -38 -9 -35 -25 13 -71 23 -22 58 -65 79 -95 21 -31 45 -62 55 -70 9 -7 33 -39 53 -69 105 -159 433 -435 625 -526 91 -43 96 -52 107 -170 19 -202 42 -377 60 -460 11 -49 28 -141 39 -202 22 -124 136 -390 163 -381 7 3 22 32 33 66 19 59 35 80 35 46 0 -9 7 -30 15 -47 8 -18 24 -58 35 -90 26 -69 71 -128 79 -103 9 24 125 -203 155 -304 44 -148 65 -223 81 -298 42 -187 169 -372 367 -534 47 -39 58 -67 72 -201 8 -70 51 -147 83 -147 17 0 48 -30 94 -90 19 -24 54 -62 79 -85 25 -22 79 -72 120 -111 89 -84 117 -104 147 -104 33 0 155 103 299 254 70 74 131 133 135 130 26 -16 89 105 89 170 0 99 21 143 101 219 43 39 93 85 113 100 90 72 196 267 231 426 9 42 27 108 40 146 13 39 28 92 35 120 20 85 149 351 150 308 0 -24 20 -13 43 24 23 36 49 99 88 207 l17 49 7 -44 c7 -42 40 -119 50 -119 13 0 129 264 145 330 54 226 86 437 99 641 11 186 17 197 146 267 55 30 131 75 169 101 84 56 386 346 433 416 81 121 170 220 223 250 66 37 68 47 10 49 -25 1 -81 16 -125 34 -72 29 -182 71 -320 122 -28 10 -90 25 -139 34 -49 9 -94 20 -100 26 -5 5 -24 10 -40 10 -26 0 -13 9 69 52 55 28 120 64 145 81 60 40 287 270 327 331 46 69 84 201 93 322 4 56 10 106 14 112 3 6 2 41 -4 79 -5 37 -17 156 -25 263 -21 261 -45 395 -66 373 -4 -4 -29 -62 -54 -128 -83 -215 -223 -448 -317 -528 -153 -128 -392 -274 -459 -279 -32 -3 -33 -1 -68 80 -42 95 -160 242 -195 242 -14 0 -26 10 -34 28 -59 134 -262 372 -317 372 -16 0 -25 -6 -25 -15 0 -8 -3 -15 -7 -15 -10 1 -72 65 -102 105 -40 54 -273 265 -291 265 -11 0 -20 -9 -22 -21 -3 -20 -8 -17 -55 25 -29 26 -55 55 -58 66 -3 10 -31 38 -63 61 -31 24 -76 60 -100 80 -58 50 -169 107 -223 114 -24 3 -57 8 -74 10 -18 3 -58 -7 -100 -23z m-967 -3016 c166 -86 117 -386 -63 -386 -177 0 -229 283 -70 381 36 22 95 24 133 5z m2286 -19 c116 -89 89 -318 -44 -358 -165 -50 -276 176 -162 330 49 65 140 78 206 28z M1495 3225 c-50 -49 -15 -135 55 -135 41 0 80 39 80 80 0 41 -39 80 -80 80 -19 0 -40 -9 -55 -25z M3725 3225 c-16 -15 -25 -36 -25 -55 0 -19 9 -40 25 -55 15 -16 36 -25 55 -25 19 0 40 9 55 25 16 15 25 36 25 55 0 19 -9 40 -25 55 -15 16 -36 25 -55 25 -19 0 -40 -9 -55 -25z"/>
      </g>
    </g>
    <!-- verified badge -->
    <circle cx="494" cy="228" r="14" fill="#0b1020"/>
    <circle cx="494" cy="228" r="12" fill="#22c58b"/>
    <path d="M488.2 228.4 L492.4 232.4 L500 224" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text class="sans" x="450" y="282" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">Protected by design</text>
    <text class="sans" x="450" y="300" font-size="10.5" text-anchor="middle" fill="#8b97b0">All security checks passed</text>

    <!-- check rows -->
    <g class="sans" font-size="10.5">
      <g>
        <rect x="350" y="318" width="200" height="28" rx="9" fill="#ffffff" fill-opacity=".06"/>
        <circle cx="365" cy="332" r="4" fill="#22c58b"/>
        <text x="378" y="336" fill="#c9d3e6">Biometric authentication</text>
        <text x="536" y="336" fill="#22c58b" font-weight="700" font-size="9" text-anchor="end">OK</text>
      </g>
      <g>
        <rect x="350" y="352" width="200" height="28" rx="9" fill="#ffffff" fill-opacity=".06"/>
        <circle cx="365" cy="366" r="4" fill="#22c58b"/>
        <text x="378" y="370" fill="#c9d3e6">TLS certificate pinning</text>
        <text x="536" y="370" fill="#22c58b" font-weight="700" font-size="9" text-anchor="end">OK</text>
      </g>
      <g>
        <rect x="350" y="386" width="200" height="28" rx="9" fill="#ffffff" fill-opacity=".06"/>
        <circle cx="365" cy="400" r="4" fill="#22c58b"/>
        <text x="378" y="404" fill="#c9d3e6">Jailbreak / root detection</text>
        <text x="536" y="404" fill="#22c58b" font-weight="700" font-size="9" text-anchor="end">OK</text>
      </g>
    </g>

    <!-- dynamic island -->
    <rect x="410" y="52" width="80" height="22" rx="11" fill="#000"/>
    <circle cx="476" cy="63" r="3.2" fill="#10182e"/>

    <!-- glass gloss -->
    <path d="M338 44 H470 L338 300 Z" fill="url(#gloss)"/>
  </g>
  <rect x="338" y="44" width="224" height="420" rx="30" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- ===== Connectors: code -> secured app -> verified ===== -->
  <g stroke="url(#connector)" stroke-width="1.6" stroke-linecap="round">
    <path class="flow" d="M286 170 C330 170 350 188 398 188"/>
    <path class="flow" d="M614 196 C570 196 552 188 502 188" style="animation-direction:reverse"/>
  </g>
  <g fill="#9db8ff">
    <circle cx="286" cy="170" r="3.2"/>
    <circle cx="614" cy="196" r="3.2"/>
  </g>
  <g fill="#cfe0ff">
    <circle cx="398" cy="188" r="2.8"/>
    <circle cx="502" cy="188" r="2.8"/>
  </g>
  <g fill="#5b86ff" opacity=".6" filter="url(#blur6)">
    <circle class="halo" cx="398" cy="188" r="5"/>
    <circle class="halo" cx="502" cy="188" r="5"/>
  </g>

  <!-- ===== Code card (left) ===== -->
  <g class="float-a">
    <g filter="url(#shadow)">
      <rect x="36" y="88" width="250" height="166" rx="14" fill="url(#cardFill)"/>
    </g>
    <rect x="36.5" y="88.5" width="249" height="165" rx="13.5" stroke="url(#cardEdge)"/>
    <circle cx="54" cy="105" r="3.6" fill="#ff5f57"/>
    <circle cx="67" cy="105" r="3.6" fill="#febc2e"/>
    <circle cx="80" cy="105" r="3.6" fill="#28c840"/>
    <text class="mono" x="270" y="108.5" font-size="9.5" fill="#6f7c99" text-anchor="end">SecureAuth.swift</text>
    <line x1="36" y1="120" x2="286" y2="120" stroke="#ffffff" stroke-opacity=".07"/>

    <g class="mono" font-size="11">
      <text x="54" y="142"><tspan fill="#ff7ab2">import</tspan><tspan fill="#c9d3e6"> LocalAuthentication</tspan></text>
      <text x="54" y="178"><tspan fill="#ff7ab2">let</tspan><tspan fill="#c9d3e6"> ctx = </tspan><tspan fill="#5eead4">LAContext</tspan><tspan fill="#c9d3e6">()</tspan></text>
      <text x="54" y="196"><tspan fill="#ff7ab2">try await</tspan><tspan fill="#c9d3e6"> ctx.</tspan><tspan fill="#7fb0ff">evaluatePolicy</tspan><tspan fill="#c9d3e6">(</tspan></text>
      <text x="67.2" y="214"><tspan fill="#c9d3e6">.deviceOwnerAuthentication,</tspan></text>
      <text x="67.2" y="232"><tspan fill="#c9d3e6">localizedReason: </tspan><tspan fill="#34d399">"Confirm"</tspan><tspan fill="#c9d3e6">)</tspan></text>
    </g>
  </g>

  <!-- ===== Audit card (right) ===== -->
  <g class="float-b">
    <g filter="url(#shadow)">
      <rect x="614" y="108" width="250" height="176" rx="14" fill="url(#cardFill)"/>
    </g>
    <rect x="614.5" y="108.5" width="249" height="175" rx="13.5" stroke="url(#cardEdge)"/>
    <!-- header -->
    <path d="M636 122 L645 125.4 V133 C645 138.6 641.2 142.4 636 144.6 C630.8 142.4 627 138.6 627 133 V125.4 Z" fill="url(#accent)"/>
    <path d="M632.4 133.2 L635 135.8 L639.8 130.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans" x="654" y="138" font-size="12.5" font-weight="700" fill="#ffffff">Security audit</text>
    <rect x="796" y="123" width="52" height="19" rx="9.5" fill="#22c58b" fill-opacity=".16"/>
    <text class="sans" x="822" y="136" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing=".6">PASSED</text>
    <line x1="614" y1="156" x2="864" y2="156" stroke="#ffffff" stroke-opacity=".07"/>

    <g class="sans" font-size="11.5" fill="#c9d3e6">
      <circle cx="636" cy="175" r="7" fill="#22c58b" fill-opacity=".18"/>
      <path d="M632.6 175.2 L635.2 177.8 L639.6 172.6" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="652" y="179">Threat modeling</text>

      <circle cx="636" cy="203" r="7" fill="#22c58b" fill-opacity=".18"/>
      <path d="M632.6 203.2 L635.2 205.8 L639.6 200.6" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="652" y="207">SAST / DAST scan</text>

      <circle cx="636" cy="231" r="7" fill="#22c58b" fill-opacity=".18"/>
      <path d="M632.6 231.2 L635.2 233.8 L639.6 228.6" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="652" y="235">Penetration test</text>

      <circle cx="636" cy="259" r="7" fill="#22c58b" fill-opacity=".18"/>
      <path d="M632.6 259.2 L635.2 261.8 L639.6 256.6" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="652" y="263">OWASP Mobile Top 10</text>
    </g>
  </g>

  <!-- ===== Floating icon badges ===== -->
  <g class="float-c">
    <g transform="translate(288 312)">
      <circle r="30" fill="#3056d3" opacity=".4" filter="url(#blur6)"/>
      <circle r="24" fill="#0d1424" stroke="url(#accentV)" stroke-width="1.4"/>
      <g stroke="#d7e4ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-7.5" y="-1" width="15" height="11.5" rx="2.6"/>
        <path d="M-4.6 -1 V-4.8 a4.6 4.6 0 0 1 9.2 0 V-1"/>
      </g>
      <circle cy="4.6" r="1.5" fill="#d7e4ff"/>
    </g>
  </g>

  <g class="float-d">
    <g transform="translate(612 336)">
      <circle r="30" fill="#3056d3" opacity=".4" filter="url(#blur6)"/>
      <circle r="24" fill="#0d1424" stroke="url(#accentV)" stroke-width="1.4"/>
      <g stroke="#d7e4ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-5.5" cy="0" r="4.8"/>
        <path d="M-0.7 0 H9.5 M6 0 V4.2 M9.5 0 V3.4"/>
      </g>
    </g>
  </g>

  <g class="float-b">
    <g transform="translate(108 330)">
      <circle r="26" fill="#3056d3" opacity=".35" filter="url(#blur6)"/>
      <circle r="20" fill="#0d1424" stroke="url(#accentV)" stroke-width="1.3"/>
      <g stroke="#d7e4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-4 -5.5 L-9 0 L-4 5.5"/>
        <path d="M4 -5.5 L9 0 L4 5.5"/>
        <path d="M1.6 -7 L-1.6 7"/>
      </g>
    </g>
  </g>

  <g class="float-a">
    <g transform="translate(796 344)">
      <circle r="26" fill="#3056d3" opacity=".35" filter="url(#blur6)"/>
      <circle r="20" fill="#0d1424" stroke="url(#accentV)" stroke-width="1.3"/>
      <g stroke="#d7e4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="0" cy="2.4" rx="4.8" ry="6"/>
        <path d="M-2.6 -4.8 a2.7 2.7 0 0 1 5.2 0"/>
        <path d="M-4.8 0.4 H-9 M4.8 0.4 H9 M-4.6 4 L-8.4 6.2 M4.6 4 L8.4 6.2 M-4.4 -1.8 L-8 -4.4 M4.4 -1.8 L8 -4.4"/>
        <path d="M0 -3.6 V8.4"/>
      </g>
    </g>
  </g>
</svg>

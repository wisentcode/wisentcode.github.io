<svg xmlns="http://www.w3.org/2000/svg" width="490" height="630" viewBox="0 0 490 630" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Product, design and engineering teams orbiting a secure-by-design bison shield</title>
  <desc id="d">The Wisent Code bison inside a shield at the centre, connected to Product, Design and Engineering, with iOS, Android and Web platform chips below.</desc>

  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .float-a { animation: float 7s ease-in-out infinite; }
    .float-b { animation: float 8s ease-in-out -2.5s infinite; }
    .float-c { animation: float 6.5s ease-in-out -4s infinite; }
    .flow    { stroke-dasharray: 3 7; animation: flow 1.8s linear infinite; }
    .ring    { animation: ring 5s ease-in-out infinite; }
    .halo    { animation: halo 4s ease-in-out infinite; }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes flow    { to { stroke-dashoffset: -20; } }
    @keyframes ring    { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes halo    { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0b1533"/>
    </linearGradient>
    <radialGradient id="glow" cx="245" cy="318" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#3056d3" stop-opacity=".55"/>
      <stop offset=".5"  stop-color="#3056d3" stop-opacity=".18"/>
      <stop offset="1"   stop-color="#3056d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotFade" cx="245" cy="318" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask"><rect width="490" height="630" fill="url(#dotFade)"/></mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9db8ff" fill-opacity=".28"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3056d3"/>
      <stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b86ff"/>
      <stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3056d3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a2f78" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16203a"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur6"  x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- ===== Backdrop ===== -->
  <rect width="490" height="630" fill="url(#bg)"/>
  <rect width="490" height="630" fill="url(#glow)"/>
  <rect width="490" height="630" fill="url(#dots)" mask="url(#dotMask)"/>

  <g fill="#cfe0ff">
    <circle class="twinkle" cx="60"  cy="96"  r="1.5"/>
    <circle class="twinkle" cx="430" cy="82"  r="1.3" style="animation-delay:-1.5s"/>
    <circle class="twinkle" cx="452" cy="250" r="1.4" style="animation-delay:-2.6s"/>
    <circle class="twinkle" cx="34"  cy="300" r="1.2" style="animation-delay:-.8s"/>
    <circle class="twinkle" cx="430" cy="520" r="1.4" style="animation-delay:-3.2s"/>
    <circle class="twinkle" cx="52"  cy="540" r="1.3" style="animation-delay:-2s"/>
  </g>

  <!-- ===== Eyebrow ===== -->
  <g class="sans">
    <circle cx="36" cy="44" r="3.2" fill="#22b8f0"/>
    <text x="48" y="48" font-size="11" font-weight="700" letter-spacing="1.6" fill="#7fb0ff">SECURE-BY-DESIGN</text>
  </g>

  <!-- ===== Orbit rings ===== -->
  <g stroke="#9db8ff" stroke-width="1.2" fill="none">
    <circle class="ring" cx="245" cy="318" r="100" stroke-opacity=".26"/>
    <circle class="ring" cx="245" cy="318" r="175" stroke-opacity=".22" style="animation-delay:-1.6s"/>
    <circle class="ring" cx="245" cy="318" r="250" stroke-opacity=".14" style="animation-delay:-3.2s"/>
  </g>

  <!-- ===== Connectors (centre -> nodes) ===== -->
  <g stroke="#7fb0ff" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round">
    <line class="flow" x1="245" y1="318" x2="245" y2="143"/>
    <line class="flow" x1="245" y1="318" x2="96"  y2="405"/>
    <line class="flow" x1="245" y1="318" x2="394" y2="405"/>
  </g>

  <!-- ===== Shield + bison (hero geometry, scaled 1.25) ===== -->
  <g transform="translate(245 228) scale(1.25) translate(-450 -98)">
    <g class="halo">
      <path d="M450 98 L504 118 V168 C504 204 482 228 450 242 C418 228 396 204 396 168 V118 Z" fill="#3a6bff" opacity=".6" filter="url(#blur14)"/>
    </g>
    <path d="M450 98 L504 118 V168 C504 204 482 228 450 242 C418 228 396 204 396 168 V118 Z"
          fill="#0a1230"/>
    <path d="M450 98 L504 118 V168 C504 204 482 228 450 242 C418 228 396 204 396 168 V118 Z"
          fill="url(#shieldFill)" stroke="url(#accentV)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M450 108 L496 125 V167 C496 198 477 218 450 231 C423 218 404 198 404 167 V125 Z"
          stroke="#9db8ff" stroke-opacity=".28" stroke-width="1"/>
    <g transform="translate(418.6 121) scale(0.11728)">
      <g transform="translate(0.000000,648.000000) scale(0.100000,-0.100000)" fill="#ffffff" stroke="none">
        <path d="M2565 6392 c-119 -48 -249 -143 -344 -252 -64 -74 -86 -87 -107 -65 -18 18 -37 10 -74 -30 -14 -15 -64 -60 -111 -101 -48 -40 -112 -107 -142 -147 -70 -93 -83 -104 -90 -77 -18 69 -187 -80 -286 -253 -72 -125 -74 -127 -92 -122 -26 9 -154 -145 -179 -214 -40 -108 -50 -121 -89 -115 -82 13 -306 157 -455 292 -128 115 -268 353 -346 588 -20 58 -24 65 -35 51 -34 -47 -70 -399 -70 -682 0 -309 28 -400 174 -560 45 -48 81 -92 81 -97 0 -15 212 -166 302 -215 57 -30 83 -49 71 -51 -10 -2 -31 -9 -48 -17 -16 -7 -52 -16 -80 -20 -66 -9 -103 -20 -205 -60 -117 -47 -319 -121 -352 -129 -38 -9 -35 -25 13 -71 23 -22 58 -65 79 -95 21 -31 45 -62 55 -70 9 -7 33 -39 53 -69 105 -159 433 -435 625 -526 91 -43 96 -52 107 -170 19 -202 42 -377 60 -460 11 -49 28 -141 39 -202 22 -124 136 -390 163 -381 7 3 22 32 33 66 19 59 35 80 35 46 0 -9 7 -30 15 -47 8 -18 24 -58 35 -90 26 -69 71 -128 79 -103 9 24 125 -203 155 -304 44 -148 65 -223 81 -298 42 -187 169 -372 367 -534 47 -39 58 -67 72 -201 8 -70 51 -147 83 -147 17 0 48 -30 94 -90 19 -24 54 -62 79 -85 25 -22 79 -72 120 -111 89 -84 117 -104 147 -104 33 0 155 103 299 254 70 74 131 133 135 130 26 -16 89 105 89 170 0 99 21 143 101 219 43 39 93 85 113 100 90 72 196 267 231 426 9 42 27 108 40 146 13 39 28 92 35 120 20 85 149 351 150 308 0 -24 20 -13 43 24 23 36 49 99 88 207 l17 49 7 -44 c7 -42 40 -119 50 -119 13 0 129 264 145 330 54 226 86 437 99 641 11 186 17 197 146 267 55 30 131 75 169 101 84 56 386 346 433 416 81 121 170 220 223 250 66 37 68 47 10 49 -25 1 -81 16 -125 34 -72 29 -182 71 -320 122 -28 10 -90 25 -139 34 -49 9 -94 20 -100 26 -5 5 -24 10 -40 10 -26 0 -13 9 69 52 55 28 120 64 145 81 60 40 287 270 327 331 46 69 84 201 93 322 4 56 10 106 14 112 3 6 2 41 -4 79 -5 37 -17 156 -25 263 -21 261 -45 395 -66 373 -4 -4 -29 -62 -54 -128 -83 -215 -223 -448 -317 -528 -153 -128 -392 -274 -459 -279 -32 -3 -33 -1 -68 80 -42 95 -160 242 -195 242 -14 0 -26 10 -34 28 -59 134 -262 372 -317 372 -16 0 -25 -6 -25 -15 0 -8 -3 -15 -7 -15 -10 1 -72 65 -102 105 -40 54 -273 265 -291 265 -11 0 -20 -9 -22 -21 -3 -20 -8 -17 -55 25 -29 26 -55 55 -58 66 -3 10 -31 38 -63 61 -31 24 -76 60 -100 80 -58 50 -169 107 -223 114 -24 3 -57 8 -74 10 -18 3 -58 -7 -100 -23z m-967 -3016 c166 -86 117 -386 -63 -386 -177 0 -229 283 -70 381 36 22 95 24 133 5z m2286 -19 c116 -89 89 -318 -44 -358 -165 -50 -276 176 -162 330 49 65 140 78 206 28z M1495 3225 c-50 -49 -15 -135 55 -135 41 0 80 39 80 80 0 41 -39 80 -80 80 -19 0 -40 -9 -55 -25z M3725 3225 c-16 -15 -25 -36 -25 -55 0 -19 9 -40 25 -55 15 -16 36 -25 55 -25 19 0 40 9 55 25 16 15 25 36 25 55 0 19 -9 40 -25 55 -15 16 -36 25 -55 25 -19 0 -40 -9 -55 -25z"/>
      </g>
    </g>
    <circle cx="502" cy="134" r="14" fill="#0b1020"/>
    <circle cx="502" cy="134" r="12" fill="#22c58b"/>
    <path d="M496.2 134.4 L500.4 138.4 L508 130" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== Orbit nodes ===== -->
  <!-- Product (top) -->
  <g class="float-a">
    <g transform="translate(167 120)">
      <g filter="url(#shadow)"><rect width="156" height="46" rx="14" fill="url(#cardFill)"/></g>
      <rect x=".5" y=".5" width="155" height="45" rx="13.5" stroke="url(#cardEdge)"/>
      <circle cx="26" cy="23" r="14" fill="url(#accent)"/>
      <g transform="translate(26 23)" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle r="6.2"/><circle r="2.1" fill="#fff" stroke="none"/>
      </g>
      <text class="sans" x="50" y="21" font-size="12.5" font-weight="700" fill="#ffffff">Product</text>
      <text class="sans" x="50" y="35" font-size="10" fill="#8b97b0">Roadmaps &amp; goals</text>
    </g>
  </g>

  <!-- Design (bottom-left) -->
  <g class="float-b">
    <g transform="translate(18 382)">
      <g filter="url(#shadow)"><rect width="156" height="46" rx="14" fill="url(#cardFill)"/></g>
      <rect x=".5" y=".5" width="155" height="45" rx="13.5" stroke="url(#cardEdge)"/>
      <circle cx="26" cy="23" r="14" fill="url(#accent)"/>
      <g transform="translate(26 23)" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-5.5 5.5 L-6.2 2.2 L3 -7 L6.2 -3.8 L-3 5.4 Z"/>
        <path d="M0.8 -4.6 L4 -1.4"/>
      </g>
      <text class="sans" x="50" y="21" font-size="12.5" font-weight="700" fill="#ffffff">Design</text>
      <text class="sans" x="50" y="35" font-size="10" fill="#8b97b0">UX &amp; UI</text>
    </g>
  </g>

  <!-- Engineering (bottom-right) -->
  <g class="float-c">
    <g transform="translate(316 382)">
      <g filter="url(#shadow)"><rect width="156" height="46" rx="14" fill="url(#cardFill)"/></g>
      <rect x=".5" y=".5" width="155" height="45" rx="13.5" stroke="url(#cardEdge)"/>
      <circle cx="26" cy="23" r="14" fill="url(#accent)"/>
      <g transform="translate(26 23)" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-3.4 -5 L-8 0 L-3.4 5"/><path d="M3.4 -5 L8 0 L3.4 5"/><path d="M1.4 -6.4 L-1.4 6.4"/>
      </g>
      <text class="sans" x="50" y="21" font-size="12.5" font-weight="700" fill="#ffffff">Engineering</text>
      <text class="sans" x="50" y="35" font-size="10" fill="#8b97b0">Mobile &amp; web</text>
    </g>
  </g>

  <!-- ===== Platform chips ===== -->
  <g class="sans" font-size="12" font-weight="600" text-anchor="middle">
    <g>
      <rect x="123" y="566" width="72" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#9db8ff" stroke-opacity=".3"/>
      <text x="159" y="585" fill="#dbe6ff">iOS</text>
    </g>
    <g>
      <rect x="205" y="566" width="80" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#9db8ff" stroke-opacity=".3"/>
      <text x="245" y="585" fill="#dbe6ff">Android</text>
    </g>
    <g>
      <rect x="295" y="566" width="72" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#9db8ff" stroke-opacity=".3"/>
      <text x="331" y="585" fill="#dbe6ff">Web</text>
    </g>
  </g>
</svg>
